name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly, Sunday 03:17 UTC — covers the mutating suite (Account/Cart/Checkout)
    # without hitting the live site on every push/PR.
    - cron: '17 3 * * 0'
  workflow_dispatch:

jobs:
  # Home, Products, Contact Us, Informational Pages, and the read-only slice of the API
  # track are read-only against the live site (no account creation, no cart/orders) —
  # safe to run on every push/PR. Contact Us's one real form submission
  # (contact-submit.spec.ts) has no cleanup step, unlike account/order creation, but
  # still creates zero accounts/orders, so it belongs here rather than in the mutating
  # bucket below. Informational Pages (test-cases.spec.ts, api-list.spec.ts) are purely
  # static-content/accordion smoke checks with zero backend calls of any kind — the
  # lowest-risk files in the whole suite. Full cross-browser matrix on push (or
  # schedule/manual dispatch); chromium-only on PR for fast feedback without tripling
  # live-site traffic on every review iteration. Note: tests/api/login.spec.ts and
  # tests/api/account.spec.ts create/delete real accounts via the API
  # (createAccount/deleteAccount) and are deliberately excluded here — see
  # mutating-suite below. Cross-Page Navigation is bucketed by file, not by chunk: 5 of
  # its 7 spec files are pure nav-contract/presence checks with no account creation
  # (nav-internal-links, nav-external-link, nav-cross-page-presence, nav-browser-back,
  # nav-reclick); the other 2 (nav-auth-state, nav-gated-flow-presence) create/delete a
  # real disposable account and belong in the mutating bucket below instead.
  read-only-suite:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'pull_request' && fromJson('["chromium"]') || fromJson('["chromium","firefox","webkit"]') }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps ${{ matrix.browser }}
    - name: Run read-only suite (Home, Products, Contact Us, Informational Pages, read-only API, read-only Navigation)
      run: npx playwright test tests/ui/home tests/ui/products tests/ui/contact tests/ui/informational tests/api/products.spec.ts tests/api/brands.spec.ts tests/api/search.spec.ts tests/ui/navigation/nav-internal-links.spec.ts tests/ui/navigation/nav-external-link.spec.ts tests/ui/navigation/nav-cross-page-presence.spec.ts tests/ui/navigation/nav-browser-back.spec.ts tests/ui/navigation/nav-reclick.spec.ts --project=${{ matrix.browser }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-read-only-${{ matrix.browser }}
        path: playwright-report/
        retention-days: 30

  # Account/Cart/Checkout create real accounts and place real orders against the
  # live site, as do tests/api/login.spec.ts and tests/api/account.spec.ts
  # (createAccount/deleteAccount via the API), as do 2 of Cross-Page Navigation's 7
  # spec files (nav-auth-state.spec.ts, nav-gated-flow-presence.spec.ts — each
  # registers and deletes one disposable account to reach the logged-in/checkout nav
  # states; the other 5 nav spec files are read-only, see read-only-suite above).
  # Never run these on push/PR — only on the weekly schedule or an explicit manual
  # dispatch, to keep live-site volume to a minimum.
  mutating-suite:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps ${{ matrix.browser }}
    - name: Run mutating suite (Account, Cart, Checkout, mutating API, mutating Navigation)
      run: npx playwright test tests/ui/account tests/ui/cart tests/ui/checkout tests/api/login.spec.ts tests/api/account.spec.ts tests/ui/navigation/nav-auth-state.spec.ts tests/ui/navigation/nav-gated-flow-presence.spec.ts --project=${{ matrix.browser }}
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-mutating-${{ matrix.browser }}
        path: playwright-report/
        retention-days: 30

  # Mobile Chrome (Pixel 5)/Mobile Safari (iPhone 12) are new device-emulation profiles
  # added 2026-08-30 to close a coverage gap (the suite previously ran desktop viewports
  # only). Deliberately scoped light for this first pass, mirroring how Informational
  # Pages started light: only the read-only core-journey files (Home, Products, and the
  # read-only slice of Cart -- excludes cart-search-login.spec.ts, which creates a real
  # account) run here, not the full suite, since these spec files were only ever
  # verified against desktop viewports and mobile-specific layout issues (overlapping
  # nav, off-screen elements, tap-vs-click behavior) are expected to need their own
  # healing pass before broadening scope. Gated to schedule/workflow_dispatch only, both
  # to keep CI runtime sane while this dimension is new and to avoid running Cart's
  # account-touching semantics on an unproven device profile without deliberate review.
  mobile-smoke:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 'engine' is the underlying browser Playwright installs (device emulation reuses
        # the desktop engine's binary with a mobile viewport/UA, it isn't a separate
        # download); 'device' is the project name declared in playwright.config.ts.
        include:
        - device: 'Mobile Chrome'
          engine: chromium
        - device: 'Mobile Safari'
          engine: webkit
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps ${{ matrix.engine }}
    - name: Run mobile smoke suite (Home, Products, read-only Cart)
      run: npx playwright test tests/ui/home tests/ui/products tests/ui/cart/cart-empty.spec.ts tests/ui/cart/cart-display.spec.ts tests/ui/cart/cart-quantity.spec.ts tests/ui/cart/cart-delete.spec.ts tests/ui/cart/cart-checkout-gate.spec.ts tests/ui/cart/cart-subscription.spec.ts --project="${{ matrix.device }}"
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-mobile-${{ matrix.device }}
        path: playwright-report/
        retention-days: 30
